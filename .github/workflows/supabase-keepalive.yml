name: Supabase keepalive

# Supabase pauses Free Plan projects after ~7 days of low user database activity.
# The docs say "a few user requests each day" clears the bar, so this runs 3x.
# Minutes are offset from :00 because GitHub queues on-the-hour schedules heavily
# and can drop them entirely under load.
on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '43 10 * * *'
    - cron: '29 18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY repo secret is not set."
            exit 1
          fi

          # Hit PostgREST so Postgres actually executes a statement. A HEAD or a
          # bare hostname ping is served before the database and would not count
          # as activity.
          status=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/keepalive?select=id&limit=1")

          echo "HTTP ${status}"
          cat /tmp/body

          if [ "${status}" != "200" ]; then
            echo "::error::Keepalive query failed with HTTP ${status}. The project may be paused."
            exit 1
          fi
